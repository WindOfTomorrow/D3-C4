[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronplain"
version = "0.3.1"
description = "Explain a five-field cron expression in plain English"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["cron", "crontab", "scheduler", "cli", "explain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
cronplain = "cronplain.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["cronplain"]
